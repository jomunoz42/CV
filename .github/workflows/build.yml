name: Build CV

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Install Ubuntu Sans
        run: sudo apt-get update && sudo apt-get install -y fonts-ubuntu
      - name: Compile CV
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: joao-munoz-cv
          path: dist/joao_munoz_cv.pdf
